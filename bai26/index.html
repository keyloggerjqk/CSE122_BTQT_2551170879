<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng ký với Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
            <div class="card-header bg-success text-white text-center py-3 border-0">
                <h4 class="mb-0 fs-5">Đăng ký tham gia CLB Lập trình Web</h4>
            </div>
            
            <div class="card-body p-4">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label for="hoTen" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="hoTen" placeholder="Nguyễn Văn A" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="maSV" class="form-label">Mã sinh viên</label>
                        <input type="text" class="form-control" id="maSV" placeholder="22xxxxxx" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="soDienThoai" class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="soDienThoai" placeholder="09xxxxxxxx" required>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label d-block">Trình độ</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="mucCoBan" value="coban" checked>
                            <label class="form-check-label" for="mucCoBan">Cơ bản</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="mucKha" value="kha">
                            <label class="form-check-label" for="mucKha">Khá</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="mucTot" value="tot">
                            <label class="form-check-label" for="mucTot">Tốt</label>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <label for="chonLop" class="form-label">Chọn lớp</label>
                        <select class="form-select" id="chonLop" required>
                            <option value="67CNTT1" selected>67CNTT1</option>
                        </select>
                    </div>
                    
                    <div class="col-12 mt-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="camKet" checked required>
                            <label class="form-check-label" for="camKet">
                                Tôi cam kết tự làm bài và quay video OBS
                            </label>
                        </div>
                    </div>
                    
                    <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                        <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                        <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

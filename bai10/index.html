<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Liên hệ với chúng tôi</h2>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>

        <form action="#">
            <div class="form-row">
                <div class="form-group">
                    <label for="ho-ten">Họ và tên</label>
                    <input type="text" id="ho-ten" value="Nguyễn Văn An">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="an.nv@tlu.edu.vn">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="sdt">Số điện thoại</label>
                    <input type="text" id="sdt" value="0987 654 321">
                </div>
                <div class="form-group">
                    <label for="chu-de">Chủ đề</label>
                    <select id="chu-de">
                        <option>Hỏi về khoá học</option>
                        <option>Góp ý</option>
                        <option>Khác</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="noi-dung">Nội dung</label>
                <textarea id="noi-dung" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
            </div>

            <div class="form-checkbox-wrapper">
                <div class="form-checkbox">
                    <input type="checkbox" id="dong-y" checked>
                    <label for="dong-y">Tôi đồng ý nhận email<br>phản hồi.</label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Gửi liên hệ</button>
                <button type="reset" class="btn-reset">Nhập lại</button>
            </div>
        </form>
    </div>

</body>
</html>

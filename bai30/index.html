<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Bảng điều khiển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex min-vh-100">
        <aside class="sidebar bg-dark text-white flex-shrink-0">
            <div class="p-3 mb-2 mt-2">
                <h6 class="fw-bold mb-0">CSE.TLU Admin</h6>
            </div>
            <ul class="nav flex-column px-2">
                <li class="nav-item mb-1">
                    <a class="nav-link active rounded bg-primary text-white" href="#">Bảng điều khiển</a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link text-secondary-light" href="#">Bài tập</a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link text-secondary-light" href="#">Sinh viên</a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link text-secondary-light" href="#">Điểm số</a>
                </li>
            </ul>
        </aside>

        <main class="flex-grow-1 bg-light p-4 content-area">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0 fw-bold text-dark">Bảng điều khiển</h4>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-warning text-dark px-2 py-1 fs-6 rounded-1">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3 py-1 fw-medium rounded-1">Xuất báo cáo</button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-2">
                        <div class="card-body">
                            <p class="text-muted mb-2 fs-6">Sinh viên</p>
                            <h3 class="fw-bold mb-3">128</h3>
                            <div class="progress thanh-tien-do">
                                <div class="progress-bar bg-primary" role="progressbar" style="width: 65%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-2">
                        <div class="card-body">
                            <p class="text-muted mb-2 fs-6">Đã nộp</p>
                            <h3 class="fw-bold mb-3">96</h3>
                            <div class="progress thanh-tien-do">
                                <div class="progress-bar bg-success" role="progressbar" style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-2">
                        <div class="card-body">
                            <p class="text-muted mb-2 fs-6">Chưa nộp</p>
                            <h3 class="fw-bold mb-3">32</h3>
                            <div class="progress thanh-tien-do">
                                <div class="progress-bar bg-danger" role="progressbar" style="width: 25%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="card border-0 shadow-sm h-100 p-2">
                        <div class="card-body">
                            <p class="text-muted mb-2 fs-6">Điểm TB</p>
                            <h3 class="fw-bold mb-3">7.8</h3>
                            <div class="progress thanh-tien-do">
                                <div class="progress-bar bg-warning" role="progressbar" style="width: 80%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-4 pb-2 px-4">
                    <h6 class="fw-bold mb-0 text-dark">Tiến độ theo chương</h6>
                </div>
                <div class="card-body px-4 pb-4 pt-2">
                    <ul class="list-group list-group-flush danh-sach-chuong">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-bottom">
                            <span class="text-dark fs-6">Chương 1 — HTML5</span>
                            <span class="badge bg-success rounded-1 px-2 py-1">100%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-bottom">
                            <span class="text-dark fs-6">Chương 2 — JavaScript</span>
                            <span class="badge bg-info text-white rounded-1 px-2 py-1">82%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-bottom">
                            <span class="text-dark fs-6">Chương 3 — CSS3</span>
                            <span class="badge bg
